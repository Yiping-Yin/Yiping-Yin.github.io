name: Man reference design study
on:
  push:
    branches: [audit/man-reference-study-20260921]
    paths: [.github/workflows/man-reference-study.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install capture tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Read public reference pages without changing the website
        run: |
          mkdir -p evidence
          cat > /tmp/capture.py <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          from playwright.sync_api import sync_playwright
          import json, re
          out = Path('evidence')
          report = {'captured_at': datetime.now(timezone.utc).isoformat(), 'purpose': 'Read-only reference capture, optional cookies off. No font or media files exported. No eligibility declarations or website changes.', 'pages': []}
          urls = [('home', 'https://www.man.com/'), ('technology', 'https://www.man.com/technology'), ('insights', 'https://www.man.com/insights'), ('about', 'https://www.man.com/about-us')]
          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True)
              context = browser.new_context(viewport={'width':1440,'height':1000})
              page = context.new_page()
              for name, url in urls:
                  record = {'name': name, 'requested_url': url}
                  report['pages'].append(record)
                  try:
                      response = page.goto(url, wait_until='domcontentloaded', timeout=45000)
                      page.wait_for_timeout(3500)
                      record.update(url=page.url, status=response.status if response else None, title=page.title())
                      page.screenshot(path=str(out / (name+'-initial.png')))
                      dialog = page.locator('#CybotCookiebotDialog')
                      if dialog.is_visible():
                          for category in ('Preferences','Statistics','Marketing'):
                              item=page.locator('#CybotCookiebotDialogBodyLevelButton'+category)
                              if item.count() and item.is_checked():
                                  item.evaluate('e=>e.click()')
                          page.get_by_role('button',name=re.compile(r'^(Use necessary cookies only|Allow selected)$')).first.click(timeout=5000)
                          dialog.wait_for(state='hidden', timeout=5000)
                      record['cookie_dialog_visible']=dialog.is_visible()
                      page.wait_for_timeout(2500)
                      page.evaluate('document.querySelectorAll("video").forEach(v=>v.pause())')
                      page.screenshot(path=str(out / (name+'-desktop-fold.png')))
                      for y in range(0, min(page.locator('body').evaluate('e=>e.scrollHeight'),14000),800):
                          page.evaluate('(y)=>window.scrollTo({top:y,behavior:"instant"})', y)
                          page.wait_for_timeout(250)
                      page.evaluate('window.scrollTo({top:0,behavior:"instant"})')
                      page.wait_for_timeout(500)
                      page.screenshot(path=str(out / (name+'-desktop-full.png')),full_page=True)
                      (out/(name+'.html')).write_text(page.content(),encoding='utf-8')
                      record['text']=page.locator('body').inner_text()
                      record['elements']=page.evaluate('''() => Array.from(document.querySelectorAll('header,nav,main,section,h1,h2,h3,h4,h5,p,a,button,img,video')).filter(e=>e.getBoundingClientRect().width>0&&e.getBoundingClientRect().height>0).map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,classes:e.className,text:(e.innerText||e.alt||'').trim().slice(0,180),x:r.x,y:r.y,w:r.width,h:r.height,color:s.color,bg:s.backgroundColor,bgImage:s.backgroundImage,font:s.fontFamily,size:s.fontSize,weight:s.fontWeight,line:s.lineHeight,letter:s.letterSpacing,padding:s.padding,gap:s.gap,border:s.borderRadius,src:e.currentSrc||e.src||'',href:e.href||''}})''')
                      record['backgrounds']=page.evaluate('''() => Array.from(document.querySelectorAll('div,section,header,footer')).filter(e=>{const r=e.getBoundingClientRect();return r.width>100&&r.height>25&&getComputedStyle(e).backgroundColor!=='rgba(0, 0, 0, 0)'}).map(e=>{const s=getComputedStyle(e),r=e.getBoundingClientRect();return {tag:e.tagName,id:e.id,classes:e.className,x:r.x,y:r.y,w:r.width,h:r.height,bg:s.backgroundColor,padding:s.padding,gap:s.gap}})''')
                      record['stylesheets']=page.locator('link[rel="stylesheet"]').evaluate_all('(es)=>es.map(e=>e.href)')
                      for i, href in enumerate(record['stylesheets']):
                          try:
                              css=context.request.get(href,timeout=15000)
                              if css.ok: (out/(name+f'-{i}.css')).write_text(css.text(),encoding='utf-8')
                          except Exception:
                              pass
                      if name in ('home','insights','technology'):
                          page.set_viewport_size({'width':390,'height':844})
                          page.wait_for_timeout(1200)
                          page.evaluate('window.scrollTo({top:0,behavior:"instant"})')
                          page.screenshot(path=str(out/(name+'-mobile-fold.png')))
                          page.screenshot(path=str(out/(name+'-mobile-full.png')),full_page=True)
                          record['mobile_headings']=page.locator('h1,h2,h3').evaluate_all('(es)=>es.filter(e=>e.getBoundingClientRect().width>0).map(e=>({text:e.innerText,font:getComputedStyle(e).fontFamily,size:getComputedStyle(e).fontSize,line:getComputedStyle(e).lineHeight}))')
                          page.set_viewport_size({'width':1440,'height':1000})
                      print(name,record['status'],record['url'],record['title'],'cookie dialog',record['cookie_dialog_visible'])
                  except Exception as exc:
                      record['error']=str(exc)
                      print(name,'ERROR',str(exc))
                      page.screenshot(path=str(out/(name+'-error.png')))
                  (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
              browser.close()
          PY
          python /tmp/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: man-reference-study
          path: evidence/
          retention-days: 7
