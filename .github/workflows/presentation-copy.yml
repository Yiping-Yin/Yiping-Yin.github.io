name: Presentation copy acceptance
on:
  push:
    branches: [upgrade/presentation-copy-20260921]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: presentation-copy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reviewed presentation copy
        run: |
          mkdir -p qa/copy
          python scripts/apply_public_copy.py
          python scripts/apply_public_p1.py --check
          python scripts/apply_public_p2.py --check
          python scripts/apply_public_copy.py --check
          git diff --check
      - name: Static contracts, immutable inputs and regression
        run: |
          set -o pipefail
          python tests/copy_acceptance.py 2>&1 | tee qa/copy/static.txt
          python tests/p1_acceptance.py 2>&1 | tee qa/copy/p1-static.txt
          python tests/p2_acceptance.py 2>&1 | tee qa/copy/p2-static.txt
          python tests/release_verifier_test.py 2>&1 | tee qa/copy/verifier.txt
          node --test tests/*.test.mjs 2>&1 | tee qa/copy/node.txt
      - name: Install isolated browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Copy journeys and existing interaction regressions
        run: |
          set -o pipefail
          python tests/copy_browser.py 2>&1 | tee qa/copy/browser.txt
          python tests/p1_browser.py 2>&1 | tee qa/copy/p1-browser.txt
          python tests/p2_browser.py 2>&1 | tee qa/copy/p2-browser.txt
          python tests/closeout_browser.py 2>&1 | tee qa/copy/closeout-browser.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentation-copy-evidence
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: presentation-copy-generated
          path: |
            index.html
            profile.html
            lab.html
            training.html
            release.json
            portfolio-assets/*-copy-v1.js
          retention-days: 14
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/presentation-copy-20260921'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: presentation-copy-generated
          path: /tmp/presentation-copy-generated
      - name: Record accepted files on the candidate branch only
        run: |
          set -euo pipefail
          for f in index.html profile.html lab.html training.html release.json portfolio-assets/training-copy-v1.js portfolio-assets/market-copy-v1.js portfolio-assets/review-copy-v1.js portfolio-assets/studio-copy-v1.js; do
            cp "/tmp/presentation-copy-generated/$f" "$f"
            git add "$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record accepted presentation copy (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/upgrade/presentation-copy-20260921
