name: Verify published website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: published-website-verification
  cancel-in-progress: true
jobs:
  verify-live:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for this commit's Pages deployment and verify all public files
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python scripts/verify_public_release.py
          --sha "$EXPECTED_SHA" --repository "$REPOSITORY"
          --output qa/live-release-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-release-verification-${{ github.run_id }}
          path: qa/live-release-verification.json
          retention-days: 14
          if-no-files-found: warn
