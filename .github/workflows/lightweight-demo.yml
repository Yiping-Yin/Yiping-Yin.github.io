name: Lightweight demo acceptance
on:
  push:
    branches: [upgrade/lightweight-demo-20260921]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: lightweight-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reproduce four existing presentation behaviors
        run: |
          set -euo pipefail
          mkdir -p qa/demo
          DEMO_BASELINE=1 python tests/demo_browser.py 2>&1 | tee qa/demo/baseline.txt
      - name: Package reviewed public source for local verification
        if: always()
        run: git archive --format=zip HEAD -o qa/public-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lightweight-demo-evidence
          path: qa/
          retention-days: 7
