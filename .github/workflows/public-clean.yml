name: Public display cleanup acceptance
on:
  push:
    branches: [fix/clean-presentation-20260922]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-clean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reproduce the requested changes on exact current main
        if: github.event_name == 'push' && hashFiles('scripts/clean_candidate.patch') != ''
        run: |
          set -euo pipefail
          mkdir -p qa/clean /tmp/clean-baseline
          git archive db4c7e336231c86d3dc564527d8fdf7af24200ee | tar -x -C /tmp/clean-baseline
          cp tests/clean_acceptance.py /tmp/clean-baseline/tests/
          CLEAN_BASELINE=1 python /tmp/clean-baseline/tests/clean_acceptance.py > qa/clean/baseline.txt 2>&1
      - name: Assemble candidate or check committed PR files
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p qa/clean
          if [ -f scripts/clean_candidate.patch ]; then
            test "$EVENT_NAME" = push
            git apply --unidiff-zero --check scripts/clean_candidate.patch
            git apply --unidiff-zero scripts/clean_candidate.patch
            rm scripts/clean_candidate.patch
            python scripts/apply_public_demo.py
            python scripts/apply_public_quality.py
          fi
          for name in p1 p2 copy four_fixes polish demo quality; do python "scripts/apply_public_${name}.py" --check; done
          for name in training-quality-v1 review-quality-v1 studio-demo-v1; do node --check "portfolio-assets/${name}.js"; done
          git diff --check
          if [ "$EVENT_NAME" = pull_request ]; then git diff --exit-code; fi
          # This fixed snapshot bounds this cleanup, not unrelated future PRs.
          if [ "$SOURCE_BRANCH" = 'fix/clean-presentation-20260922' ]; then
            git diff --exit-code db4c7e336231c86d3dc564527d8fdf7af24200ee -- assets data portfolio-assets/terminal-hero.js portfolio-assets/terminal-hero.css portfolio-assets/market-quality-v1.js portfolio-assets/quality-ui.mjs portfolio-assets/quality-model.mjs
          fi
      - name: Full static, unit and data verification
        run: |
          set -euo pipefail
          for t in p1_acceptance p2_acceptance copy_acceptance four_fixes_acceptance four_fixes_generator_test release_verifier_test publication_integrity_test book_publication_test polish_acceptance polish_generator_test polish_review_test demo_acceptance quality_acceptance clean_acceptance clean_workflow_test; do
            python "tests/$t.py" 2>&1 | tee "qa/clean/$t.txt"
          done
          node --test tests/*.test.mjs 2>&1 | tee qa/clean/node.txt
          python scripts/verify_publication.py --output qa/clean/publication-audit.json
      - name: New layout checks and all retained browser journeys
        run: |
          set -euo pipefail
          for t in clean_browser quality_browser demo_browser polish_browser p1_browser p2_browser copy_browser four_fixes_browser four_fixes_review_test closeout_browser; do
            python "tests/$t.py" 2>&1 | tee "qa/clean/$t.txt"
          done
      - name: Package exact source and generated files
        if: always()
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          pathlib.Path('qa').mkdir(exist_ok=True)
          names = subprocess.check_output(['git','ls-files'],text=True).splitlines()
          with zipfile.ZipFile('qa/public-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  if pathlib.Path(name).is_file(): z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-display-clean-evidence
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: public-display-clean-candidate
          path: qa/public-source.zip
          retention-days: 14
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/clean-presentation-20260922'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: public-display-clean-candidate
          path: /tmp/clean-candidate
      - name: Record tested candidate without merging or publishing
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/clean-candidate/public-source.zip') as z: z.extractall('.')
          PY
          git rm --ignore-unmatch scripts/clean_candidate.patch
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record accepted display cleanup (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/fix/clean-presentation-20260922
