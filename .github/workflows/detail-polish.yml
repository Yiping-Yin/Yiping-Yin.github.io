name: Detailed portfolio polish acceptance
on:
  push:
    branches: [polish/detail-polish-20260922]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: detail-polish-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0 websocket-client==1.8.0
          python -m playwright install --with-deps chromium
      - name: Reproduce layout and playback defects on the exact baseline
        if: github.event_name == 'push' && hashFiles('scripts/detail_candidate.patch') != ''
        run: |
          set -euo pipefail
          mkdir -p qa/detail /tmp/detail-baseline
          git archive fade5cc2231833a3fe446b7a74f7f889559ebe9c | tar -x -C /tmp/detail-baseline
          cp tests/detail_browser.py tests/native_visibility.py /tmp/detail-baseline/tests/
          xvfb-run -a python - <<'PY' > qa/detail/baseline-browser.txt 2>&1
          import importlib.util, unittest
          spec=importlib.util.spec_from_file_location('baseline','/tmp/detail-baseline/tests/detail_browser.py')
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          names=('test_phone_terminal_is_compact_and_all_controls_are_visible','test_hidden_tab_pauses_without_automatic_restart')
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(module.DetailBrowser(n) for n in names))
          if result.errors or len(result.failures)!=2: raise SystemExit('Expected two baseline assertion failures, not errors or unexpected passes')
          print('Both baseline defects reproduced; these expected failures are NOT passing candidate tests.')
          PY
      - name: Assemble candidate or verify committed PR files
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p qa/detail
          if [ -f scripts/detail_candidate.patch ]; then
            test "$EVENT_NAME" = push
            git apply --check scripts/detail_candidate.patch
            git apply scripts/detail_candidate.patch
            rm scripts/detail_candidate.patch
            python scripts/apply_public_demo.py
            python scripts/apply_public_quality.py
          fi
          for name in p1 p2 copy four_fixes polish demo quality; do python "scripts/apply_public_${name}.py" --check; done
          for name in training-quality-v1 market-quality-v1 review-quality-v1 studio-demo-v1; do node --check "portfolio-assets/${name}.js"; done
          git diff --check
          if [ "$EVENT_NAME" = pull_request ]; then git diff --exit-code; fi
          if [ "$SOURCE_BRANCH" = 'polish/detail-polish-20260922' ]; then
            git diff --exit-code fade5cc2231833a3fe446b7a74f7f889559ebe9c -- assets data portfolio-assets/terminal-hero.js portfolio-assets/terminal-hero.css portfolio-assets/tokens.css
          fi
      - name: Full static, unit and data verification
        run: |
          set -euo pipefail
          for t in p1_acceptance p2_acceptance copy_acceptance four_fixes_acceptance four_fixes_generator_test release_verifier_test publication_integrity_test book_publication_test polish_acceptance polish_generator_test polish_review_test demo_acceptance quality_acceptance clean_acceptance clean_workflow_test detail_acceptance; do
            python "tests/$t.py" 2>&1 | tee "qa/detail/$t.txt"
          done
          node --test tests/*.test.mjs 2>&1 | tee qa/detail/node.txt
          python scripts/verify_publication.py --output qa/detail/publication-audit.json
      - name: Detail browser checks and genuine background tabs
        run: |
          set -euo pipefail
          xvfb-run -a python tests/detail_browser.py 2>&1 | tee qa/detail/detail-browser.txt
      - name: All retained browser journeys
        run: |
          set -euo pipefail
          for t in clean_browser quality_browser demo_browser polish_browser p1_browser p2_browser copy_browser four_fixes_browser four_fixes_review_test closeout_browser; do
            python "tests/$t.py" 2>&1 | tee "qa/detail/$t.txt"
          done
      - name: Package the exact source used by this run
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, zipfile
          pathlib.Path('qa').mkdir(exist_ok=True)
          names=subprocess.check_output(['git','ls-files'],text=True).splitlines()
          files={}
          with zipfile.ZipFile('qa/public-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in names:
                  path=pathlib.Path(name)
                  if path.is_file():
                      z.write(name,name); files[name]=hashlib.sha256(path.read_bytes()).hexdigest()
          pathlib.Path('qa/source-manifest.json').write_text(json.dumps({'testedInput':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'files':files},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-polish-evidence
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: detail-polish-candidate
          path: qa/public-source.zip
          retention-days: 14
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/polish/detail-polish-20260922'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: detail-polish-candidate
          path: /tmp/detail-candidate
      - name: Record tested files on the candidate branch only
        run: |
          set -euo pipefail
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/detail-candidate/public-source.zip') as z: z.extractall('.')
          PY
          git rm --ignore-unmatch scripts/detail_candidate.patch
          git add -u
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record verified detail polish (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/polish/detail-polish-20260922
