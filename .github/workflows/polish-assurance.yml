name: Presentation and publication assurance
on:
  push:
    branches: [upgrade/runtime-evidence-polish-20260921]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: polish-assurance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate reviewed presentation only
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p qa/polish
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/apply_public_polish.py --check
            git diff --exit-code
          else
            python scripts/apply_public_polish.py
          fi
          node --check portfolio-assets/studio-details-v1.js
          git diff --check
      - name: All static and unit regressions
        run: |
          set -euo pipefail
          for t in p1_acceptance p2_acceptance copy_acceptance four_fixes_acceptance four_fixes_generator_test release_verifier_test publication_integrity_test book_publication_test polish_acceptance polish_generator_test polish_review_test; do
            python "tests/$t.py" 2>&1 | tee "qa/polish/$t.txt"
          done
          node --test tests/*.test.mjs 2>&1 | tee qa/polish/node.txt
          python scripts/verify_publication.py --output qa/polish/publication-audit.json
      - name: Install isolated browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Presentation journeys and all previous browser regressions
        run: |
          set -euo pipefail
          for t in polish_browser p1_browser p2_browser copy_browser four_fixes_browser four_fixes_review_test closeout_browser; do
            python "tests/$t.py" 2>&1 | tee "qa/polish/$t.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: polish-assurance-evidence
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: polish-generated
          path: |
            index.html
            lab.html
            training.html
            release.json
            portfolio-assets/studio-details-v1.js
            scripts/verify_public_release.py
            scripts/apply_public_four_fixes.py
            tests/copy_browser.py
          retention-days: 14
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/runtime-evidence-polish-20260921'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: polish-generated
          path: /tmp/polish-generated
      - name: Record accepted generated output on the candidate branch only
        run: |
          set -euo pipefail
          for f in index.html lab.html training.html release.json portfolio-assets/studio-details-v1.js scripts/verify_public_release.py scripts/apply_public_four_fixes.py tests/copy_browser.py; do cp "/tmp/polish-generated/$f" "$f"; git add "$f"; done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record accepted presentation and publication assurance (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/upgrade/runtime-evidence-polish-20260921
