name: Public P1 acceptance
on:
  push:
    branches: [upgrade/p1-evidence-export-20260921]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-p1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate public P1 pages
        run: |
          mkdir -p qa
          python scripts/apply_public_p1.py
          python scripts/apply_public_p1.py --check
          git diff --check
      - name: Static and source-export tests
        run: |
          set -o pipefail
          python tests/p1_acceptance.py 2>&1 | tee qa/static-tests.txt
          node --test tests/source-export.test.mjs 2>&1 | tee qa/source-tests.txt
      - name: Install isolated browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Real Chromium acceptance
        run: |
          set -o pipefail
          python tests/p1_browser.py 2>&1 | tee qa/browser-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-acceptance-evidence
          path: qa/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: p1-generated-pages
          path: |
            index.html
            profile.html
            lab.html
            training.html
            release.json
          retention-days: 7
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/p1-evidence-export-20260921'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: p1-generated-pages
          path: /tmp/p1-generated-pages
      - name: Record verified pages on the candidate branch only
        run: |
          set -euo pipefail
          for file in index.html profile.html lab.html training.html release.json; do
            cp "/tmp/p1-generated-pages/$file" "$file"
          done
          git add index.html profile.html lab.html training.html release.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record verified public P1 pages (acceptance run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/upgrade/p1-evidence-export-20260921
