name: Portfolio refinement acceptance
on:
  push:
    branches: [upgrade/portfolio-refine-20260922]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-refine-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reproduce the four findings on exact current main
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p /tmp/refine-baseline qa/refine
          git archive db4c7e336231c86d3dc564527d8fdf7af24200ee | tar -x -C /tmp/refine-baseline
          cp tests/refine_browser.py /tmp/refine-baseline/tests/
          REFINE_BASELINE=1 REFINE_EVIDENCE="$PWD/qa/refine/baseline" xvfb-run -a python /tmp/refine-baseline/tests/refine_browser.py 2>&1 | tee qa/refine/baseline.txt
      - name: Generate candidate or check committed PR output
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p qa/refine
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/apply_public_refine.py --check
            git diff --exit-code
          else
            python scripts/apply_public_refine.py
          fi
          git diff --check
          git diff --exit-code db4c7e336231c86d3dc564527d8fdf7af24200ee -- assets data portfolio-assets/terminal-hero.js portfolio-assets/terminal-hero.css portfolio-assets/quality-model.mjs portfolio-assets/quality-ui.mjs portfolio-assets/market-quality-v1.js portfolio-assets/review-quality-v1.js portfolio-assets/training-quality-v1.js
      - name: Full static and data regression
        run: |
          set -euo pipefail
          for t in p1_acceptance p2_acceptance copy_acceptance four_fixes_acceptance four_fixes_generator_test release_verifier_test publication_integrity_test book_publication_test polish_acceptance polish_generator_test polish_review_test demo_acceptance quality_acceptance refine_acceptance; do
            python "tests/$t.py" 2>&1 | tee "qa/refine/$t.txt"
          done
          node --test tests/*.test.mjs 2>&1 | tee qa/refine/node.txt
          python scripts/verify_publication.py --output qa/refine/publication-audit.json
      - name: Native tab visibility and complete browser regression
        run: |
          set -euo pipefail
          xvfb-run -a python tests/refine_browser.py 2>&1 | tee qa/refine/refine_browser.txt
          for t in quality_browser demo_browser polish_browser p1_browser p2_browser copy_browser four_fixes_browser four_fixes_review_test closeout_browser; do
            python "tests/$t.py" 2>&1 | tee "qa/refine/$t.txt"
          done
      - name: Package exact candidate source
        if: always()
        run: |
          python - <<'PY'
          import pathlib,subprocess,zipfile
          names=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          names.add('portfolio-assets/market-refine-v1.js')
          with zipfile.ZipFile('qa/public-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(names):
                  if pathlib.Path(name).is_file():z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-refine-evidence
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-refine-generated
          path: |
            index.html
            profile.html
            training.html
            release.json
            portfolio-assets/market-refine-v1.js
            scripts/apply_public_demo.py
            scripts/apply_public_quality.py
            scripts/verify_public_release.py
            tests/demo_acceptance.py
            tests/demo_browser.py
            tests/copy_browser.py
            tests/quality_acceptance.py
          retention-days: 14
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/portfolio-refine-20260922'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: portfolio-refine-generated
          path: /tmp/refine-generated
      - name: Record tested output on candidate branch only
        run: |
          set -euo pipefail
          for f in index.html profile.html training.html release.json portfolio-assets/market-refine-v1.js scripts/apply_public_demo.py scripts/apply_public_quality.py scripts/verify_public_release.py tests/demo_acceptance.py tests/demo_browser.py tests/copy_browser.py tests/quality_acceptance.py; do
            cp "/tmp/refine-generated/$f" "$f"
            git add "$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record accepted portfolio refinements (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/upgrade/portfolio-refine-20260922
