name: Public demo quality acceptance
on:
  push:
    branches: [upgrade/demo-quality-20260921]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: public-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Reproduce four missing behaviours on the accepted baseline
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p qa/quality /tmp/quality-baseline
          git archive 083ca17d29df1565ef48cdf5778de5e9e08714ed | tar -x -C /tmp/quality-baseline
          cp tests/quality_browser.py /tmp/quality-baseline/tests/
          QUALITY_BASELINE=1 QUALITY_EVIDENCE="$PWD/qa/quality/baseline" python /tmp/quality-baseline/tests/quality_browser.py 2>&1 | tee qa/quality/baseline.txt
      - name: Generate candidate or verify committed PR output
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          mkdir -p qa/quality
          if [ "$EVENT_NAME" = "pull_request" ]; then
            python scripts/apply_public_quality.py --check
            git diff --exit-code
          else
            python scripts/apply_public_quality.py
          fi
          for f in portfolio-assets/*-quality-v1.js portfolio-assets/quality-*.mjs; do node --check "$f"; done
          git diff --check
      - name: Full static, unit and publication regression suite
        run: |
          set -euo pipefail
          for t in p1_acceptance p2_acceptance copy_acceptance four_fixes_acceptance four_fixes_generator_test release_verifier_test publication_integrity_test book_publication_test polish_acceptance polish_generator_test polish_review_test demo_acceptance quality_acceptance; do
            python "tests/$t.py" 2>&1 | tee "qa/quality/$t.txt"
          done
          node --test tests/*.test.mjs 2>&1 | tee qa/quality/node.txt
          python scripts/verify_publication.py --output qa/quality/publication-audit.json
      - name: New and retained browser journeys
        run: |
          set -euo pipefail
          for t in quality_browser demo_browser polish_browser p1_browser p2_browser copy_browser four_fixes_browser four_fixes_review_test closeout_browser; do
            python "tests/$t.py" 2>&1 | tee "qa/quality/$t.txt"
          done
      - name: Package reviewed candidate source and generated files
        if: always()
        run: |
          python - <<'PY'
          import pathlib,subprocess,zipfile
          root=pathlib.Path('.')
          files=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
          files.update(str(p) for p in root.glob('portfolio-assets/*-quality-v1.js'))
          with zipfile.ZipFile('qa/public-source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in sorted(files):
                  if pathlib.Path(name).is_file():z.write(name,name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-quality-evidence
          path: qa/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: public-quality-generated
          path: |
            index.html
            profile.html
            lab.html
            training.html
            compare.html
            research-algothon.html
            404.html
            release.json
            portfolio-assets/training-quality-v1.js
            portfolio-assets/review-quality-v1.js
            portfolio-assets/market-quality-v1.js
            scripts/apply_public_demo.py
            scripts/verify_public_release.py
            scripts/public_p2_pages.py
            tests/demo_acceptance.py
            tests/copy_browser.py
          retention-days: 14
  record-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/upgrade/demo-quality-20260921'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: public-quality-generated
          path: /tmp/quality-generated
      - name: Record tested output on candidate branch only
        run: |
          set -euo pipefail
          for f in index.html profile.html lab.html training.html compare.html research-algothon.html 404.html release.json portfolio-assets/training-quality-v1.js portfolio-assets/review-quality-v1.js portfolio-assets/market-quality-v1.js scripts/apply_public_demo.py scripts/verify_public_release.py scripts/public_p2_pages.py tests/demo_acceptance.py tests/copy_browser.py; do
            cp "/tmp/quality-generated/$f" "$f"
            git add "$f"
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Record accepted public demo quality (run ${GITHUB_RUN_ID})"
          git push origin HEAD:refs/heads/upgrade/demo-quality-20260921
